name: Build CS Launcher Plus APK

on:
  workflow_dispatch:          # Manual trigger
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & build tools
        run: |
          sdkmanager --install "ndk;27.3.13750724" "build-tools;34.0.0" "platforms;android-34" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          ./gradlew :app_pojavlauncher:assembleRelease --stacktrace --no-daemon
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY || 'DUMMY' }}

      - name: Find and list APK
        run: |
          echo "=== Built APKs ==="
          find app_pojavlauncher/build/outputs/apk -name "*.apk" -type f || true
          ls -lh app_pojavlauncher/build/outputs/apk/release/ || true

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CS-Launcher-Plus-Release
          path: |
            app_pojavlauncher/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload mapping (if any)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mapping-files
          path: |
            app_pojavlauncher/build/outputs/mapping/**
          if-no-files-found: ignore
          retention-days: 7
