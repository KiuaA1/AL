name: Build CS Launcher Plus APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          ./gradlew :app_pojavlauncher:assembleRelease --stacktrace --no-daemon
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY || 'DUMMY' }}

      - name: Find and list APK
        run: |
          echo "=== Built APKs ==="
          find app_pojavlauncher/build/outputs/apk -name "*.apk" -type f || true
          ls -lh app_pojavlauncher/build/outputs/apk/release/ || true

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CS-Launcher-Plus-Release
          path: |
            app_pojavlauncher/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
